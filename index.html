<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kiosk Video Loop</title>
    <style>
        /* Force layout boundaries to stretch true edge-to-edge across iPad glass margins */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Enforce absolute viewport scaling to stop page compression windows */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000000;
            z-index: 1;
        }

        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>

    <!-- 
      - Re-routed video through direct CDN proxy to bypass iOS Safari MIME blocks.
      - Starts muted so iOS/NeatKiosk guarantees it will autoplay instantly without freezing.
    -->
    <video 
        id="kiosk-video"
        controls 
        loop 
        autoplay 
        muted
        playsinline
        webkit-playsinline>
        <source src="https://jsdelivr.net" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        const video = document.getElementById('kiosk-video');

        // Prime the player volume to 100%
        video.volume = 1.0;

        // The moment a user interacts with the video controls, trigger Apple’s 
        // playback gesture permission rule to unmute the video at max volume.
        window.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }
        }, { once: true });
    </script>

</body>
</html>
