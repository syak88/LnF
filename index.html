<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiosk Video Loop</title>
    <style>
        /* Force a clean, pitch-black kiosk layout with absolutely no scrollbars or margins */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Force the video to take up 100% of the screen space while preserving its aspect ratio */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000000;
        }

        /* Strict prevention against standard callout boxes and UI selections on iOS */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>

    <!-- 
      - Starts muted so iOS/NeatKiosk guarantees it will autoplay instantly without freezing.
      - Playback controls are fully enabled for the user to seek and pause.
    -->
    <video 
        id="kiosk-video"
        controls 
        loop 
        autoplay 
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
        <source src="https://github.com" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        const video = document.getElementById('kiosk-video');

        // Prime the player volume to 100%
        video.volume = 1.0;

        // The moment a user interacts with the video controls, trigger Apple’s 
        // playback gesture permission rule to unmute the video at max volume.
        window.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }
        }, { once: true }); // 'once: true' makes this code run only on the very first touch
    </script>

</body>
</html>
