<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiosk Video Loop</title>
    <style>
        /* Force a clean, pitch-black kiosk layout with absolutely no scrollbars or margins */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Force the video to take up 100% of the screen space while preserving its aspect ratio */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000000;
        }

        /* Large, prominent Unmute Banner overlay */
        #unmute-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45); /* Softly dims the initial video framework */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        /* The stylized interactive Unmute Pill button */
        .unmute-btn {
            background-color: rgba(255, 255, 255, 0.95);
            color: #000000;
            padding: 18px 36px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: pulse 2s infinite;
        }

        /* Soft pulsing visual animation to grab a kiosk visitor's attention */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        /* Clean transition style when the audio is initialized */
        #unmute-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Strict prevention against standard callout boxes and UI selections on iOS */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>

    <!-- Large landing overlay ensuring early visitor interaction -->
    <div id="unmute-overlay">
        <div class="unmute-btn">
            🔊 Tap to Start with Sound
        </div>
    </div>

    <!-- 
      - Native iOS kiosk tags embedded.
      - Uses crossorigin definition to handle complex cloud stream permissions.
    -->
    <video 
        id="kiosk-video"
        controls 
        loop 
        autoplay 
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
        <source src="https://github.com" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        const video = document.getElementById('kiosk-video');
        const overlay = document.getElementById('unmute-overlay');

        // Prime the system for immediate max hardware utilization
        video.volume = 1.0;

        // Bypass Apple autoplay blocking rules seamlessly
        function activateKioskAudio() {
            video.muted = false;
            video.volume = 1.0;
            
            // Explicitly verify the stream triggers immediately
            video.play().catch(err => console.log("Stream synchronization pending:", err));
            
            // Fade out the startup overlay smoothly
            overlay.classList.add('hidden');
        }

        // Direct event listener for the central interactive element
        overlay.addEventListener('click', activateKioskAudio);

        // Fail-safe global click catch in case a visitor taps a native player track element
        window.addEventListener('click', () => {
            if (video.muted) {
                activateKioskAudio();
            }
        }, { once: true });
    </script>

</body>
</html>
